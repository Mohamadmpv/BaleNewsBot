name: Bale News Bot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHANNEL: ${{ secrets.BALE_CHANNEL }}
        run: python bot.py
