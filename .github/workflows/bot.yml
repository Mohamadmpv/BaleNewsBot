name: Run Bale News Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # هر ۵ دقیقه اجرا شود
  workflow_dispatch: {}    # امکان اجرای دستی

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run the bot
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
        run: python bot.py
      
      - name: Commit updated memory files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent.txt users.txt offset.txt
          git diff --staged --quiet || git commit -m "Update memory files"
          git push
